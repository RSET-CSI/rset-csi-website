<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSI 2025 Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/phosphor-icons"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
    .gradient-header { background: linear-gradient(90deg, #1e3a8a, #3b82f6); }
    .table-scrollbar::-webkit-scrollbar { width: 6px; }
    .table-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .table-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    .table-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .rank-gold { background-color: #fffbeb; color: #b45309; }
    .rank-silver { background-color: #f8fafc; color: #4b5563; }
    .rank-bronze { background-color: #fdf2f2; color: #991b1b; }
  </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
  <!-- Header -->
  <header class="gradient-header text-white p-4 sm:p-6 rounded-2xl shadow-lg flex justify-between items-center mb-8">
    <div class="flex items-center space-x-4">
      <i class="ph-crown-simple text-3xl md:text-4xl text-yellow-300"></i>
      <div>
        <h1 class="text-xl md:text-2xl font-bold">CSI 2025 Leaderboard</h1>
        <p class="text-sm md:text-base opacity-80">Live rankings and scores</p>
      </div>
    </div>
    <button class="bg-white/20 hover:bg-white/30 transition-colors text-white font-semibold py-2 px-4 rounded-lg flex items-center space-x-2">
      <i class="ph-calendar"></i>
      <span>October 2025</span>
    </button>
  </header>

  <!-- Main Content -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Student Leaderboard -->
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-lg">
      <h2 class="text-xl font-bold text-gray-800 flex items-center mb-4">
        <i class="ph-trophy text-yellow-500 mr-2 text-2xl"></i>
        Student Leaderboard
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="border-b text-gray-500">
              <th class="p-3 font-medium">Rank</th>
              <th class="p-3 font-medium">UID</th>
              <th class="p-3 font-medium">Name</th>
              <th class="p-3 font-medium">Class</th>
              <th class="p-3 font-medium text-right">Points</th>
            </tr>
          </thead>
          <tbody id="student-leaderboard-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Class Leaderboard -->
    <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-lg">
      <h2 class="text-xl font-bold text-gray-800 flex items-center mb-4">
        <i class="ph-users-three text-blue-500 mr-2 text-2xl"></i>
        Class Leaderboard
      </h2>
      <div class="overflow-y-auto table-scrollbar" style="max-height: 500px;">
        <table class="w-full text-left">
          <thead>
            <tr class="border-b text-gray-500">
              <th class="p-3 font-medium">Rank</th>
              <th class="p-3 font-medium">Class</th>
              <th class="p-3 font-medium text-right">Points</th>
            </tr>
          </thead>
          <tbody id="class-leaderboard-body"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script>
  const studentLeaderboardBody = document.getElementById('student-leaderboard-body');
  const classLeaderboardBody = document.getElementById('class-leaderboard-body');

  // --- Helper for rank badges ---
  function getRankContent(rank) {
    const rankClasses = "font-bold rounded-full w-8 h-8 flex items-center justify-center text-sm";
    switch(rank) {
      case 1: return `<div class="${rankClasses} rank-gold"><i class="ph-trophy"></i></div>`;
      case 2: return `<div class="${rankClasses} rank-silver"><i class="ph-trophy"></i></div>`;
      case 3: return `<div class="${rankClasses} rank-bronze"><i class="ph-trophy"></i></div>`;
      default: return `<div class="${rankClasses} bg-gray-100 text-gray-600">#${rank}</div>`;
    }
  }

  // --- Populate Student Leaderboard ---
  function populateStudentLeaderboard(studentData) {
    const sorted = studentData.sort((a,b) => b.points - a.points);
    let html = '';

    let currentRank = 0;
    let lastPoints = null;
    let actualPosition = 0;

    sorted.forEach((s) => {
      actualPosition++; // counts real position
      if (s.points !== lastPoints) {
        currentRank = actualPosition; // update rank only if points differ
        lastPoints = s.points;
      }

      html += `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-3">${getRankContent(currentRank)}</td>
          <td class="p-3 text-gray-500 font-mono text-sm">${s.uid}</td>
          <td class="p-3 font-semibold text-gray-800">${s.name}</td>
          <td class="p-3 text-gray-600">${s.class}</td>
          <td class="p-3 font-bold text-gray-800 text-right">${s.points}</td>
        </tr>
      `;
    });
    studentLeaderboardBody.innerHTML = html;
  }

  // --- Populate Class Leaderboard ---
  function populateClassLeaderboard(classData) {
    let html = '';
    let currentRank = 0;
    let lastPoints = null;
    let actualPosition = 0;

    classData.forEach((cls) => {
      actualPosition++;
      if (cls.points !== lastPoints) {
        currentRank = actualPosition;
        lastPoints = cls.points;
      }

      html += `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-3">${getRankContent(currentRank)}</td>
          <td class="p-3 font-semibold text-gray-800">${cls.name}</td>
          <td class="p-3 font-bold text-gray-800 text-right">${cls.points}</td>
        </tr>
      `;
    });
    classLeaderboardBody.innerHTML = html;
  }

  // --- Fetch JSON and populate ---
  window.addEventListener('load', () => {
    fetch('leaderboard.json')
      .then(res => res.json())
      .then(studentData => {
        populateStudentLeaderboard(studentData);

        // Step 1️⃣: Calculate total points per class
        const classPoints = {};
        studentData.forEach(s => {
          const pts = Number(s.points) || 0;
          if (!s.class) return;
          classPoints[s.class] = (classPoints[s.class] || 0) + pts;
        });

        // Step 2️⃣: Apply manual class point adjustments
        const manualAdjustments = {
          "AI&DS": 30, 
          "CSE - Beta": 10, 
        };

        for (const [cls, delta] of Object.entries(manualAdjustments)) {
          classPoints[cls] = (classPoints[cls] || 0) + delta;
        }

        // Step 3️⃣: Convert to array + sort by points
        const classData = Object.entries(classPoints)
          .map(([name, points]) => ({ name, points }))
          .sort((a, b) => b.points - a.points);

        // Step 4️⃣: Display leaderboard
        populateClassLeaderboard(classData);

        if (typeof ph !== 'undefined') ph.update();
      })
      .catch(err => console.error("Failed to load leaderboard.json:", err));
  });
</script>

</body>
</html>
